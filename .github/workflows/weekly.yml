name: Ciclo semanal Weinstein

on:
  schedule:
    - cron: "17 8 * * 6"      # sábados 08:17 UTC, mercado cerrado
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo simular (no envía órdenes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: weinstein-bot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Ciclo semanal
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.run_weekly ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Guardar estado y web
        run: |
          git config user.name "weinstein-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state docs universe
          git diff --cached --quiet || git commit -m "Ciclo semanal $(date -u +%F)"
          git push
