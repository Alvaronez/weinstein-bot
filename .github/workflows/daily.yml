name: Guardián diario de stops

on:
  schedule:
    - cron: "40 21 * * 1-5"   # tras el cierre de Wall Street (verano e invierno)
  workflow_dispatch:

permissions:
  contents: write

concurrency: weinstein-bot

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Guardián
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.guard
      - name: Guardar estado y web
        run: |
          git config user.name "weinstein-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "Guardián $(date -u +%F)"
          git push
